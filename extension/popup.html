<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 14px; width: 300px; background: #0a0e14; color: #e8eef7; }
    h1 { font-size: 14px; margin: 0 0 12px; }
    label { display: block; font-size: 11px; color: #8b9bb4; margin: 8px 0 4px; }
    input { width: 100%; box-sizing: border-box; padding: 8px; border-radius: 8px; border: 1px solid rgba(148,163,184,.25); background: #111822; color: inherit; }
    button { margin-top: 12px; width: 100%; padding: 9px; border: 0; border-radius: 8px; background: #2dd4bf; color: #042f2e; font-weight: 650; cursor: pointer; }
    #status { margin-top: 10px; font-size: 12px; color: #8b9bb4; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Recall Capture</h1>
  <label>Backend URL</label>
  <input id="url" placeholder="http://127.0.0.1:8787" />
  <label>API token</label>
  <input id="token" placeholder="dev-token-change-me" />
  <button id="save">Save</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
